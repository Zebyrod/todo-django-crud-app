<!-- main_app/templates/tasks/task_form.html -->

{% extends 'base.html' %}
{% block content %}

<section class="container my-5">
    <h1 class="mb-4">
        {{ form.instance.pk|yesno:'Edit Task,Create Task' }}
    </h1>
	<form method="POST">
		{% csrf_token %}

        <div class="mb-3">
            {{ form.name.label_tag }}
            {{ form.name }}
        </div>

		<button type="submit" class="btn btn-primary">{{ form.instance.pk|yesno:'Update Task,Create Task' }}</button>
	</form>
</section>

{% endblock %}
